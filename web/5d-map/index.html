<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Interactive world map visualizing 5D intelligence dimensions with status-quo heatmaps, IMP-score choropleth, alternative schools, and time-travel feature." />
  <meta name="theme-color" content="#16213e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="5D-Map" />
  
  <!-- Content Security Policy -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: https://*.tile.openstreetmap.org https://*.wikimedia.org; connect-src 'self' https://ourworldindata.org https://api.worldbank.org https://api.github.com; font-src 'self' data:; frame-src 'none'; base-uri 'self'; form-action 'self';" />
  
  <title>5D‑Intelligenz Weltkarte</title>
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="./manifest.json" />
  
  <!-- Icons for various devices -->
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="./icons/icon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-192x192.png" />
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a href="#main-content" class="skip-link">Zum Inhalt springen</a>
  <header class="app-header">
    <h1>🌍 5D‑Intelligenz Global</h1>
    <div class="controls">
      <button 
        id="layer-status-quo" 
        class="btn btn--primary"
        title="Zeigt Heatmap für Depression & Dropout-Raten weltweit"
        aria-label="Status Quo Heatmap anzeigen">
        Status Quo
      </button>
      <button 
        id="reset-cache" 
        class="btn"
        title="Cache leeren (localStorage) und Daten neu laden"
        aria-label="Cache leeren und neu laden">
        Cache reset
      </button>
      <button 
        id="layer-schools" 
        class="btn"
        title="Alternative Schulmodelle: Sudbury, Waldorf, Folk High Schools, Tokkatsu"
        aria-label="Alternative Schulen auf Karte anzeigen">
        Alternative Schulen
      </button>
      <button 
        id="layer-imp" 
        class="btn"
        title="Intrinsisches Motivationspotenzial (IMP = A×IM×R×SP×Au)"
        aria-label="IMP-Score Choropleth anzeigen">
        IMP‑Score
      </button>
      <button 
        id="layer-validation" 
        class="btn"
        title="Validierung (Ringe): zeigt Länder/Regionen mit extern verifizierten Daten (validation.json)"
        aria-label="Validierung (Ringe) anzeigen">
        Validierung (Ringe)
      </button>
      <button 
        id="export-validation-csv" 
        class="btn"
        title="Exportiert validation.json als CSV (Status-Filter beachten)"
        aria-label="Validierung als CSV exportieren">
        Export (CSV)
      </button>
      <button 
        id="export-validation-json" 
        class="btn"
        title="Exportiert gefilterte validation.json als JSON (Status-Filter beachten)"
        aria-label="Validierung als JSON exportieren">
        Export (JSON)
      </button>
      <span id="validation-count" style="margin-left:.5rem;font-size:.9rem;color:#444;" title="Anzahl der Validierungs‑Einträge im aktuellen Filter">Filter: <strong>alle</strong> · Einträge: <strong>0</strong></span>
      <button 
        id="layer-sources" 
        class="btn"
        title="Quellen (Marker): zeigt Anzahl/Kategorien pro Land (validation.json)"
        aria-label="Quellen (Marker) anzeigen">
        Quellen (Marker)
      </button>
      <button 
        id="layer-time" 
        class="btn"
        title="Zeitreise durch historische Daten (2000-2025)"
        aria-label="Zeitreise-Modus aktivieren">
        Zeitreise ⏱️
      </button>
    </div>
  </header>

  <main id="main-content">
    <div id="map"></div>
    <div id="layer-info" style="display:none;padding:0.5rem 1rem;max-width:640px;margin:0.5rem;background:#fffffe;border:1px solid #e0e0e0;border-radius:0.5rem;">
      <strong>Layer‑Info:</strong> <span id="layer-info-text">—</span>
    </div>
    <div id="time-controls" style="display:none;padding:0.5rem 1rem;max-width:480px;margin:0.5rem;background:#fffffe;border:1px solid #e0e0e0;border-radius:0.5rem;">
      <label for="year-slider"><strong>Jahr: <span id="year-label">—</span></strong></label>
      <input type="range" id="year-slider" min="2000" max="2025" value="2025" step="1" style="width:100%;" />
      <small>Zeigt Heatmap für ausgewähltes Jahr (Depression/Dropout). Fallback: Nur vorhandene Werte.</small>
    </div>
  </main>

  <!-- Loading Overlay -->
  <div class="loading-overlay">
    <div class="loading-spinner">
      <div class="spinner"></div>
      <p>Lade Daten...</p>
    </div>
  </div>

  <footer class="app-footer">
    <p>Letzte Aktualisierung: <span id="last-update">Lädt…</span></p>
    <nav>
      <a href="#sources">Datenquellen</a> ·
      <a href="#about">Über</a> ·
      <a href="https://github.com/karlitos1337/5d" target="_blank" rel="noreferrer">GitHub</a>
      · <a href="./data/validation.json" download>validation.json herunterladen</a>
    </nav>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  
  <!-- Web Vitals Performance Monitoring -->
  <script type="module">
    // Core Web Vitals tracking
    import {onCLS, onFID, onLCP, onFCP, onTTFB} from 'https://unpkg.com/web-vitals@3/dist/web-vitals.js?module';
    
    function sendToAnalytics({name, value, rating}) {
      console.log(`[Web Vitals] ${name}: ${value.toFixed(2)}ms (${rating})`);
      
      // Optional: Send to analytics service
      // fetch('/analytics', {
      //   method: 'POST',
      //   body: JSON.stringify({metric: name, value, rating})
      // });
    }
    
    onCLS(sendToAnalytics);  // Cumulative Layout Shift
    onFID(sendToAnalytics);  // First Input Delay
    onLCP(sendToAnalytics);  // Largest Contentful Paint
    onFCP(sendToAnalytics);  // First Contentful Paint
    onTTFB(sendToAnalytics); // Time to First Byte
  </script>
  
  <!-- Service Worker Registration -->
  <script>
    // Register service worker for PWA functionality
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((registration) => {
            console.log('✓ Service Worker registered:', registration.scope);
            
            // Check for updates
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              console.log('Service Worker update found');
              
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // New version available, show update notification
                  if (confirm('Neue Version verfügbar! Seite neu laden?')) {
                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                    window.location.reload();
                  }
                }
              });
            });
          })
          .catch((error) => {
            console.warn('Service Worker registration failed:', error);
          });
      });
      
      // Listen for controller change (new service worker activated)
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        console.log('Service Worker updated, reloading...');
        window.location.reload();
      });
    }
    
    // PWA install prompt
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      
      // Show custom install button (optional)
      const installBtn = document.getElementById('install-btn');
      if (installBtn) {
        installBtn.style.display = 'block';
        installBtn.addEventListener('click', () => {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then((choice) => {
            console.log('PWA install choice:', choice.outcome);
            deferredPrompt = null;
            installBtn.style.display = 'none';
          });
        });
      }
    });
    
    // Track PWA installation
    window.addEventListener('appinstalled', () => {
      console.log('✓ PWA installed successfully');
      deferredPrompt = null;
    });
  </script>
  
  <script type="module" src="app.js"></script>
</body>
<style>
  /* Fallback, falls styles.css nicht lädt */
  #map { min-height: 70vh; }
  .btn[disabled] { opacity: .6; cursor: not-allowed; }
  body.loading { cursor: progress; }
  body.loading .btn { pointer-events: none; opacity: .7; }
  .app-header, .app-footer { padding: .75rem 1rem; }
</style>
</html>
