<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Awesome Piracy</title>
	<link rel="stylesheet" href="" id="bootswatch-css">
	<link rel="icon" href="rocket-takeoff.svg" type="image/svg+xml">
	<style>
		main
		{
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji';
			font-size: 16px;
			line-height: 1.5;
			width: 960px;
			margin: auto;
		}
		select
		{
			position: fixed;
			bottom: 0;
			right: 0;
		}
	</style>
</head>
<body>

	<select onchange="changeCSS( this.value )">
		<option value="darkly">Darkly</option>
		<option value="united">United</option>
		<option value="flatly">Flatly</option>
		<option value="quartz">Quartz</option>
	</select>

	<main></main>

	<!-- JavaScript Library to Convert Markdown into HTML -->
	<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

	<!-- Marked plugin to add heading ID's -->
	<script src="https://cdn.jsdelivr.net/npm/marked-gfm-heading-id/lib/index.umd.js"></script>

	<script>
		// Basic Settings
		const defaultTheme = 'darkly';
		const bootswatchVersion = '5.3.7'; // Last updated: 5 July, 2025
		// Update last one only when https://www.jsdelivr.com/package/npm/bootswatch is updated.

		// Configure marked.js to use Github heading ID's to allow the Contents list to function
		marked.use( markedGfmHeadingId.gfmHeadingId() );

		// Get the markdown file, convert it to HTML & put it inside the main tag
		fetch( 'https://raw.githubusercontent.com/Shakil-Shahadat/awesome-piracy/main/Readme.md' )
			.then( response => response.text() )
			.then( data => {
				data = data.replaceAll( ':star2:', '<img src="https://github.githubassets.com/images/icons/emoji/unicode/1f31f.png?v8" width="20">' );
				document.querySelector( 'main' ).innerHTML = marked.parse( data );
			})
			.catch( error => console.error( 'Error:', error ) );

		// Change the theme
		function changeCSS( theme )
		{
			// Allowed themes - keep this list in sync with the select/options elsewhere in the file
			const allowedThemes = new Set(['darkly','united','flatly','quartz','cerulean','cosmo','cyborg','litera','lux','morph','pulse','solar','simplex','sketchy','slate','spacelab','superhero','vapor','yeti']);
			const fallbackTheme = 'darkly';

			// Validate bootswatchVersion (simple semver-like check). Adjust the fallback version to one you prefer.
			const versionSafe = (/^[0-9]+\.[0-9]+\.[0-9]+(?:[-+].+)?$/).test(bootswatchVersion)
				? bootswatchVersion
				: '5.3.7';

			const themeSafe = allowedThemes.has(theme) ? theme : fallbackTheme;

			const href = `https://cdn.jsdelivr.net/npm/bootswatch@${encodeURIComponent(versionSafe)}/dist/${encodeURIComponent(themeSafe)}/bootstrap.min.css`;

			const cssLink = document.getElementById('bootswatch-css');
			if (cssLink) {
				// Use preload -> stylesheet swap to reduce FOUC
				cssLink.rel = 'preload';
				cssLink.as = 'style';
				cssLink.crossOrigin = 'anonymous';
				cssLink.href = href;

				cssLink.onload = function () {
					// When preload finishes, switch to stylesheet so it applies
					try { cssLink.rel = 'stylesheet'; } catch (e) { /* ignore */ }
				};

				cssLink.onerror = function () {
					console.error('Failed to load BootsWatch theme:', href);
					// fallback to default theme if the requested one failed
					if (themeSafe !== fallbackTheme) {
						const fallbackHref = `https://cdn.jsdelivr.net/npm/bootswatch@${encodeURIComponent(versionSafe)}/dist/${encodeURIComponent(fallbackTheme)}/bootstrap.min.css`;
						// attempt to load fallback as stylesheet
						cssLink.rel = 'stylesheet';
						cssLink.href = fallbackHref;
					}
				};
			}
		}

		// Set the default theme
		changeCSS( defaultTheme );
	</script>
</body>
</html>
