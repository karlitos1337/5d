<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Awesome Piracy</title>
	<link rel="stylesheet" href="" id="bootswatch-css">
	<link rel="icon" href="rocket-takeoff.svg" type="image/svg+xml">
	<style>
		main
		{
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji';
			font-size: 16px;
			line-height: 1.5;
			width: 960px;
			margin: auto;
		}
		select
		{
			position: fixed;
			bottom: 0;
			right: 0;
		}
	</style>
</head>
<body>

	<select onchange="changeCSS( this.value )">
		<option value="darkly">Darkly</option>
		<option value="united">United</option>
		<option value="flatly">Flatly</option>
		<option value="quartz">Quartz</option>
	</select>

	<main></main>

	<!-- JavaScript Library to Convert Markdown into HTML -->
	<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

	<!-- Marked plugin to add heading ID's -->
	<script src="https://cdn.jsdelivr.net/npm/marked-gfm-heading-id/lib/index.umd.js"></script>

	<script>
		// ============================================================================
		// Theme Configuration - Centralized settings for BootsWatch theme management
		// ============================================================================
		const THEME_CONFIG = {
			bootswatchVersion: '5.3.7', // Last updated: 5 July, 2025
			                             // Update when https://www.jsdelivr.com/package/npm/bootswatch is updated
			defaultTheme: 'darkly',
			allowedThemes: ['darkly', 'united', 'flatly', 'quartz'],
			cdnBaseUrl: 'https://cdn.jsdelivr.net/npm/bootswatch'
		};

		// Configure marked.js to use Github heading ID's to allow the Contents list to function
		marked.use( markedGfmHeadingId.gfmHeadingId() );

		// Get the markdown file, convert it to HTML & put it inside the main tag
		fetch( 'https://raw.githubusercontent.com/Shakil-Shahadat/awesome-piracy/main/Readme.md' )
			.then( response => response.text() )
			.then( data => {
				data = data.replaceAll( ':star2:', '<img src="https://github.githubassets.com/images/icons/emoji/unicode/1f31f.png?v8" width="20">' );
				document.querySelector( 'main' ).innerHTML = marked.parse( data );
			})
			.catch( error => console.error( 'Error:', error ) );

		/**
		 * Safely constructs a BootsWatch CDN URL with validation and encoding
		 * @param {string} theme - Theme name to load
		 * @returns {string} Validated and encoded CDN URL
		 */
		function buildThemeUrl( theme ) {
			// Validate theme against allowlist
			if (!THEME_CONFIG.allowedThemes.includes(theme)) {
				console.warn(`Theme "${theme}" not in allowlist, falling back to default`);
				theme = THEME_CONFIG.defaultTheme;
			}
			
			// Sanitize theme name - only allow alphanumeric and hyphens
			const sanitizedTheme = theme.replace(/[^a-z0-9\-]/gi, '');
			if (sanitizedTheme !== theme) {
				console.warn(`Theme name contained invalid characters, sanitized to: ${sanitizedTheme}`);
			}
			
			// Construct URL with validated components (encodeURIComponent for extra safety)
			const version = encodeURIComponent(THEME_CONFIG.bootswatchVersion);
			const themeName = encodeURIComponent(sanitizedTheme);
			return `${THEME_CONFIG.cdnBaseUrl}@${version}/dist/${themeName}/bootstrap.min.css`;
		}

		/**
		 * Changes the active theme with error handling and fallback
		 * @param {string} theme - Theme name to apply
		 * @param {boolean} isFallback - Internal flag to prevent infinite recursion
		 */
		function changeCSS( theme, isFallback = false ) {
			const url = buildThemeUrl( theme );
			const linkElement = document.getElementById('bootswatch-css');
			
			// Create a temporary link to load the new theme; only update the main link if loading succeeds
			const testLink = document.createElement('link');
			testLink.rel = 'stylesheet';
			testLink.href = url;
			
			const cleanup = function() {
				// Remove the test link to prevent memory leaks
				if (testLink.parentNode) {
					testLink.parentNode.removeChild(testLink);
				}
			};
			
			testLink.onload = function() {
				// Successfully loaded, apply the theme
				linkElement.href = url;
				console.log(`Theme "${theme}" loaded successfully`);
				cleanup();
			};
			
			testLink.onerror = function() {
				// Failed to load, keep current theme
				console.error(`Failed to load theme "${theme}" from ${url}`);
				cleanup();
				// If this was not already the default theme and not already a fallback attempt,
				// try loading the default theme as fallback (only once to prevent infinite recursion)
				if (theme !== THEME_CONFIG.defaultTheme && !isFallback) {
					console.log(`Attempting to load fallback theme: ${THEME_CONFIG.defaultTheme}`);
					changeCSS(THEME_CONFIG.defaultTheme, true);
				} else if (isFallback) {
					console.error('Fallback theme also failed to load. No theme will be applied.');
				}
			};
			
			// Start the test load
			document.head.appendChild(testLink);
		}

		// Set the default theme on page load
		changeCSS( THEME_CONFIG.defaultTheme );
	</script>
</body>
</html>
