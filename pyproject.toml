[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "99_unsortiert",
    "external",
    "private-gpt-main",
]

line-length = 100
target-version = "py310"

[tool.mypy]
ignore_missing_imports = true
exclude = [
    "99_unsortiert",
    "external",
    "private-gpt-main",
    "node_modules",
]

[tool.black]
line-length = 100
target-version = ['py310']
extend-exclude = '''
/(
  | 99_unsortiert
  | external
  | private-gpt-main
  | node_modules
)/
'''

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov"
testpaths = [
    "tests",
    "src_python/tests",
]
norecursedirs = [
    "99_unsortiert",
    "external",
    "private-gpt-main",
    "node_modules",
]
markers = [
    "integration: mark test as an integration test",
    "asyncio: mark test as async",
]
pythonpath = [
    ".",
    "src_python",
]
