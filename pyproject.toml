[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
lint.select = ["E", "F", "I", "B", "UP"]
lint.ignore = ["E203", "E501"]
exclude = ["private-gpt-main/"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "src_python/tests"]
norecursedirs = ["99_unsortiert", "private-gpt-main", "external", "5d", "node_modules", "dist", "venv"]
addopts = "--ignore=99_unsortiert --ignore=private-gpt-main --ignore=external --ignore=5d --ignore=node_modules --ignore=dist --ignore=venv"
markers = [
    "asyncio: mark a test as an asyncio test",
    "integration: mark a test as an integration test"
]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
exclude = ["private-gpt-main/"]
