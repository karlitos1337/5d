[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
norecursedirs = [
    "99_unsortiert",
    ".git",
    "__pycache__",
    "node_modules",
    "external",
]

[tool.ruff]
extend-exclude = [
    "99_unsortiert",
    "external",
]
[tool.black]
extend-exclude = '''
/(
  | 99_unsortiert
  | external
  | private-gpt-main
  | 5d
  | node_modules
  | outputs
  | venv
)/
'''
line-length = 100
target-version = ["py310"]
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | 99_unsortiert
  | external
  | private-gpt-main
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
lint.select = ["E", "F", "I", "B", "UP"]
lint.ignore = ["E203", "E501"]
exclude = ["private-gpt-main/", "99_unsortiert/", "external/"]
exclude = ["private-gpt-main/"]
exclude = ["private-gpt-main/", "99_unsortiert/", "external/", "5d/", "node_modules/", "outputs/", "venv/", "docs/analysis/verify_app.py", "scripts/", "tools/add_frontmatter.py", "utils/", "src_python/knowledge_graph/", "tests/", "src/universal_system_genesis_5d/"]
exclude = [
    "private-gpt-main/",
    "99_unsortiert/",
    "external/",
    "outputs/",
    "5d/",
    "node_modules/",
    "dist/",
    "docs/",
    "simulations/",
    "venv/",
    "web/",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
exclude = ["private-gpt-main/", "99_unsortiert/", "external/"]

[tool.pytest.ini_options]
norecursedirs = ["99_unsortiert", "external", "private-gpt-main", "node_modules", ".git"]
exclude = ["private-gpt-main/"]
exclude = ["private-gpt-main/", "99_unsortiert/", "external/", "5d/", "node_modules/", "outputs/", "venv/", "docs/analysis/verify_app.py", "scripts/", "tools/add_frontmatter.py", "utils/", "src_python/knowledge_graph/", "tests/", "src/universal_system_genesis_5d/"]

[tool.pytest.ini_options]



norecursedirs = [".git", "node_modules", "99_unsortiert", "private-gpt-main", "external", "5d"]
exclude = ["private-gpt-main/", "99_unsortiert/", "external/", "outputs/", "5d/", "node_modules/", "dist/", "docs/", "simulations/", "venv/"]
ignore_errors = true
