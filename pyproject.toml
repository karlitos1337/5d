[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "private-gpt-main/",
    "99_unsortiert/",
    "external/",
    "5d/",
    "node_modules/",
    "dist/",
    "build/",
    "outputs/",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E203", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
exclude = [
    "private-gpt-main/",
    "99_unsortiert/",
    "external/",
    "5d/",
    "node_modules/",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
    "src_python/tests",
]
norecursedirs = [
    "99_unsortiert",
    "external",
    "5d",
    "private-gpt-main",
    "node_modules",
    "dist",
    "build",
    "outputs",
    ".git",
]
markers = [
    "asyncio: mark a test as asyncio",
    "integration: mark a test as integration",
]
