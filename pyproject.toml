[tool.black]
line-length = 100
target-version = ["py310"]
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | node_modules
  | 99_unsortiert
  | external
  | 5d
  | private-gpt-main
  | outputs
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
lint.select = ["E", "F", "I", "B", "UP"]
lint.ignore = ["E203", "E501"]
exclude = ["99_unsortiert", "external", "5d", "private-gpt-main", "node_modules", "dist", "build", "outputs"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
exclude = ["99_unsortiert", "external", "5d", "private-gpt-main", "node_modules", "dist", "build", "outputs"]
explicit_package_bases = true

[tool.pytest.ini_options]
minversion = "6.0"
norecursedirs = ["99_unsortiert", "external", "5d", "node_modules", "dist", "build", "outputs", "private-gpt-main"]
markers = [
    "asyncio: mark test as asyncio",
    "integration: mark test as integration"
]
testpaths = ["tests", "src_python/tests"]
