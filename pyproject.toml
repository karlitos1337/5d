[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = '''
(
  99_unsortiert
  | external
  | private-gpt-main
  | node_modules
)
'''

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "private-gpt-main",
    "99_unsortiert",
    "external",
    "node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E203", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
exclude = [
    "private-gpt-main",
    "99_unsortiert",
    "external",
    "node_modules",
]

[tool.pytest.ini_options]
addopts = "--cov=. --cov-report=xml"
norecursedirs = [
    "99_unsortiert",
    "external",
    "private-gpt-main",
    "node_modules",
    "web"
]
python_files = "test_*.py"
markers = [
    "asyncio: mark test as async",
    "integration: mark test as integration test"
]
