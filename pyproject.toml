[tool.ruff]
exclude = [
    "99_unsortiert",
    "external",
    "node_modules",
    "dist",
    "build",
    "outputs",
    ".venv",
    "__pycache__"
]
line-length = 120

[tool.black]
line-length = 120
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | 99_unsortiert
  | external
  | node_modules
)/
'''

[tool.pytest.ini_options]
norecursedirs = [
    "99_unsortiert",
    "external",
    "node_modules",
    "dist",
    "build",
    "outputs"
]
python_files = "test_*.py"
markers = [
    "asyncio: mark test as async",
    "integration: mark test as integration test"
]
