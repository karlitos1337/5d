[tool.black]
line-length = 100
target-version = ["py310"]
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | node_modules
  | 99_unsortiert
  | external
  | private-gpt-main
  | outputs
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"

exclude = ["private-gpt-main/", "external/", "99_unsortiert/", "Jules/", "jules/"]
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  "E203", "E501", "E702",
  "F841", "F401", "F811", "F541",
  "B006", "B007", "B008", "B904", "B905",
  "UP006", "UP007", "UP035", "UP015",
  "UP045",
  "I001",
]

[tool.ruff.lint.per-file-ignores]
"utils/**" = ["ALL"]
"streamlit/**" = ["ALL"]
"src/**" = ["ALL"]
"scripts/**" = ["ALL"]
"simulations/**" = ["ALL"]
"tests/**" = ["ALL"]
"tools/**" = ["ALL"]
"pages/**" = ["ALL"]
"auth/**" = ["ALL"]
"jules/**" = ["ALL"]
"Jules/**" = ["ALL"]
"analysis/**" = ["ALL"]
"config/**" = ["ALL"]
"99_unsortiert/**" = ["ALL"]
"external/**" = ["ALL"]
"manifest/**" = ["ALL"]
"data/**" = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
exclude = [
    "private-gpt-main/",
    "99_unsortiert/",
    "external/"
]

[tool.pytest.ini_options]
testpaths = ["tests", "src_python/tests"]
norecursedirs = [
    "99_unsortiert",
    "external",
    "private-gpt-main",
    "node_modules",
    "dist",
    "build",
    "outputs"
]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test", "*Tests"]
python_functions = ["test_*"]
markers = [
    "asyncio: mark a test as an asyncio coroutine",
    "integration: mark a test as an integration test",
    "slow: mark test as slow",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    # Ignore invalid escape sequence warnings from third-party libs or non-critical files
    "ignore:invalid escape sequence:SyntaxWarning"
]
