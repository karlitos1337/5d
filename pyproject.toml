[tool.black]
line-length = 100
target-version = ['py310']
extend-exclude = '''
/(
  | 99_unsortiert
  | external
  | private-gpt-main
  | node_modules
)/
'''

[tool.ruff]
exclude = [
    "99_unsortiert",
    "external",
    "private-gpt-main",
    "node_modules",
]
ignore = ["E501"]

[tool.mypy]
exclude = [
    "99_unsortiert",
    "external",
    "private-gpt-main",
    "node_modules",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=. --cov-report=xml"
norecursedirs = [
    "99_unsortiert",
    "external",
    "private-gpt-main",
    "node_modules",
]
