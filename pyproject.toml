[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
# Use regex to exclude 99_unsortiert and external from formatting
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | node_modules
  | 99_unsortiert
  | external
  | private-gpt-main
)/
'''

[tool.ruff]
line-length = 88
target-version = "py310"
# Exclude broken/legacy code from linting
exclude = [
    "99_unsortiert",
    "external",
    "private-gpt-main",
    "node_modules",
    ".git",
    "build",
    "dist"
]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
# Exclude broken/legacy code from type checking
exclude = [
    "99_unsortiert",
    "external",
    "private-gpt-main",
    "node_modules"
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
# Ignore broken/legacy directories during test collection
norecursedirs = [
    "99_unsortiert",
    "external",
    "private-gpt-main",
    "node_modules",
    ".git",
    "build",
    "dist"
]
