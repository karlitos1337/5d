[tool.black]
line-length = 100
target-version = ["py310"]
exclude = '''
/(
    99_unsortiert
  | external
  | private-gpt-main
  | node_modules
  | dist
  | build
  | outputs
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
lint.select = ["E", "F", "I", "B", "UP"]
lint.ignore = ["E203", "E501"]
exclude = [
    "99_unsortiert",
    "external",
    "private-gpt-main",
    "node_modules",
    "dist",
    "build",
    "outputs",
    "tools",
    "scripts",
    "pages",
    "utils/caching.py",
    "utils/mobile_responsive.py"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
exclude = [
    "99_unsortiert",
    "external",
    "private-gpt-main",
    "node_modules",
    "dist",
    "build",
    "outputs"
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests", "src_python/tests"]
norecursedirs = [
    "99_unsortiert",
    "external",
    "private-gpt-main",
    "node_modules",
    "dist",
    "build",
    "outputs"
]
markers = [
    "asyncio: mark test as asyncio",
    "integration: mark test as integration"
]
# Removed addopts = "--cov=." to allow CI to control coverage execution
