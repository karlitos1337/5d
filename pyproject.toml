[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
addopts = "-v --cov=. --cov-report=xml"
testpaths = ["tests", "src", "src_python/tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
norecursedirs = [
    "99_unsortiert",
    "external",
    "node_modules",
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "private-gpt-main"
]

[tool.ruff]
line-length = 100
target-version = "py310"
lint.select = ["E", "F", "I", "B", "UP"]
lint.ignore = ["E203", "E501"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "venv",
    ".venv",
    "node_modules",
    "external",
    "data",
    "99_unsortiert",
    "private-gpt-main"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
exclude = ["private-gpt-main/", "99_unsortiert/", "external/"]
