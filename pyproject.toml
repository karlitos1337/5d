[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = '''
(
  99_unsortiert/
  | external/
  | 5d/
  | private-gpt-main/
  | node_modules/
)
'''

[tool.ruff]
line-length = 100
target-version = "py310"
lint.select = ["E", "F", "I", "B", "UP"]
lint.ignore = ["E203", "E501"]
exclude = ["private-gpt-main/", "99_unsortiert/", "external/", "5d/", "node_modules/"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
exclude = ["private-gpt-main/", "99_unsortiert/", "external/", "5d/", "node_modules/", "outputs/", "docs/", "simulations/"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --ignore=99_unsortiert/ --ignore=external/ --ignore=private-gpt-main/ --ignore=5d/"
norecursedirs = ["99_unsortiert", "external", "private-gpt-main", "5d"]
testpaths = [
    "tests",
    "src_python/tests"
]
markers = [
    "asyncio: mark a test as requiring asyncio",
    "integration: mark a test as an integration test",
]
