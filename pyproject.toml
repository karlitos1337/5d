[tool.black]
extend-exclude = '''
/(
  | 99_unsortiert
  | external
  | outputs
  | 5d
  | private-gpt-main
  | node_modules
  | dist
  | docs
  | web
  | venv
)/
'''
line-length = 100
target-version = ["py310"]
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | 99_unsortiert
  | external
  | private-gpt-main
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
lint.select = ["E", "F", "I", "B", "UP"]
lint.ignore = ["E203", "E501"]
exclude = [
    "private-gpt-main/",
    "99_unsortiert/",
    "external/",
    "outputs/",
    "5d/",
    "node_modules/",
    "dist/",
    "docs/",
    "simulations/",
    "venv/",
    "web/",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
exclude = ["99_unsortiert", "external", "outputs", "5d", "private-gpt-main", "node_modules", "dist", "docs", "simulations", "venv"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests", "src_python/tests"]
pythonpath = ["."]
norecursedirs = [
    ".git",
    "__pycache__",
    "node_modules",
    "99_unsortiert",
    "private-gpt-main",
    "external",
    "5d",
    "dist",
    "venv",
    "outputs",
    "docs"
]
addopts = "-ra -q --ignore=99_unsortiert --ignore=private-gpt-main --ignore=external --ignore=5d --ignore=node_modules --ignore=dist --ignore=venv"
markers = [
    "asyncio: mark a test as asyncio",
    "integration: mark a test as an integration test",
]
