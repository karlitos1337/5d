[tool.black]
line-length = 100
target-version = ["py310"]
force-exclude = '''
/(
    99_unsortiert
  | external
  | 5d
  | private-gpt-main
  | node_modules
  | docs
  | outputs
  | pages
  | scripts
  | simulations
  | src_python
  | tests
  | tools
  | utils
  | validation
  | .*5d_dashboard\.py
  | .*5d_research_scraper\.py
  | .*gol_streamlit\.py
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
lint.select = ["E", "F", "I", "B", "UP"]
lint.ignore = ["E203", "E501"]
exclude = [
    "99_unsortiert",
    "external",
    "5d",
    "private-gpt-main",
    "node_modules",
    "5d_dashboard.py",
    "5d_research_scraper.py",
    "docs",
    "gol_streamlit.py",
    "outputs",
    "pages",
    "scripts",
    "simulations",
    "src_python",
    "tests",
    "tools",
    "utils",
    "validation"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
exclude = [
    "99_unsortiert/",
    "external/",
    "5d/",
    "private-gpt-main/",
    "node_modules/"
]

[tool.pytest.ini_options]
testpaths = ["tests", "src_python/tests"]
norecursedirs = ["99_unsortiert", "external", "5d", "private-gpt-main", "node_modules"]
markers = [
    "asyncio: mark test as an asyncio coroutine",
    "integration: mark test as integration test"
]