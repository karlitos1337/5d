[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | node_modules
  | 99_unsortiert
  | external
  | private-gpt-main
  | outputs
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "99_unsortiert",
    "external",
    "private-gpt-main",
    "node_modules",
    "dist",
    "build",
    "outputs"
]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "99_unsortiert",
    "external",
    "private-gpt-main",
    "node_modules",
    "dist",
    "build",
    "outputs"
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=."
testpaths = [
    "tests",
    "src_python/tests",
]
norecursedirs = [
    "99_unsortiert",
    "external",
    "private-gpt-main",
    "node_modules",
    "dist",
    "build",
    "outputs",
    ".git",
    ".venv"
]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
