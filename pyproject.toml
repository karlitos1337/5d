[tool.black]
line-length = 100
target-version = ['py310']
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | 99_unsortiert
  | external
  | private-gpt-main
  | node_modules
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "99_unsortiert",
    "external",
    "private-gpt-main",
    "node_modules",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
exclude = [
    "99_unsortiert",
    "external",
    "private-gpt-main",
    "node_modules",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-v --cov=. --cov-report=xml"
testpaths = [
    "tests",
    "src_python/tests",
]
norecursedirs = [
    "99_unsortiert",
    "external",
    "private-gpt-main",
    "node_modules",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
