[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = '''
/(
    99_unsortiert
  | external
  | private-gpt-main
  | node_modules
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "private-gpt-main",
    "99_unsortiert",
    "external",
    "node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E203", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
exclude = [
    "private-gpt-main",
    "99_unsortiert",
    "external",
    "node_modules",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=."
testpaths = [
    "tests",
    "src_python/tests",
]
norecursedirs = [
    "99_unsortiert",
    "external",
    "node_modules",
    "private-gpt-main",
    ".*",
    "venv",
    "env",
    "dist",
    "build",
    "ui"
]
