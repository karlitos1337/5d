[tool.black]
line-length = 100
target-version = ["py310"]
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | node_modules
  | 99_unsortiert
  | external
  | private-gpt-main
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "99_unsortiert",
    "external",
    "private-gpt-main",
    "node_modules",
    ".git",
    "__pycache__",
    "build",
    "dist",
    "*.pyi"
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E203", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
exclude = [
    "99_unsortiert",
    "external",
    "private-gpt-main",
    "node_modules",
