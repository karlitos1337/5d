[tool.pytest.ini_options]
addopts = "--cov=. --cov-report=xml"
norecursedirs = [
    "99_unsortiert",
    "external",
    "private-gpt-main",
    "node_modules",
    "outputs",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "99_unsortiert",
    "external",
    "private-gpt-main",
    "node_modules",
    "outputs",
]

[tool.mypy]
exclude = [
    "99_unsortiert",
    "external",
    "private-gpt-main",
    "node_modules",
    "outputs",
]

[tool.black]
line-length = 100
target-version = ["py310"]
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | 99_unsortiert
  | external
  | outputs
  | private-gpt-main
  | node_modules
)/
'''
