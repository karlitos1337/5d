[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | 99_unsortiert
  | external
  | node_modules
  | private-gpt-main
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "99_unsortiert",
    "external",
    "private-gpt-main",
    "node_modules",
    ".git",
    "__pycache__",
    "build",
    "dist",
    "*.ipynb"
]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests", "src_python/tests"]
python_files = ["test_*.py"]
addopts = "--cov=. --cov-report=xml"
norecursedirs = [
    "99_unsortiert",
    "external",
    "private-gpt-main",
    "node_modules",
    "*.egg",
    ".*"
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
exclude = [
    "99_unsortiert",
    "external",
    "private-gpt-main"
]
