[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "private-gpt-main/",
    "99_unsortiert/",
    "external/",
    "node_modules/",
    ".venv/"
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E203", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
exclude = [
    "private-gpt-main/",
    "99_unsortiert/",
    "external/",
    "node_modules/"
]

[tool.pytest.ini_options]
norecursedirs = [
    "99_unsortiert",
    "external",
    "node_modules",
    "private-gpt-main",
    ".git",
    ".venv"
]
addopts = "--cov --cov-report=xml"
asyncio_mode = "auto"
markers = [
    "asyncio: mark test as asyncio",
    "integration: mark test as integration"
]
