[tool.black]
line-length = 100
target-version = ['py310']
extend-exclude = '''
/(
    99_unsortiert
  | external
  | private-gpt-main
  | node_modules
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "99_unsortiert",
    "external",
    "private-gpt-main",
    "node_modules",
]

[tool.mypy]
ignore_missing_imports = true
exclude = [
    "99_unsortiert",
    "external",
    "private-gpt-main",
    "node_modules",
]

[tool.pytest.ini_options]
addopts = "--cov=. --cov-report=xml"
norecursedirs = [
    "99_unsortiert",
    "external",
    "node_modules",
]
python_files = ["test_*.py"]
markers = [
    "asyncio: mark a test as an asyncio test",
    "integration: mark a test as an integration test",
]
