[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
lint.select = ["E", "F", "I", "B", "UP"]
lint.ignore = ["E203", "E501"]
exclude = ["private-gpt-main/", "99_unsortiert/", "external/"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
exclude = ["private-gpt-main/", "99_unsortiert/", "external/", "outputs/", "docs/5d-map/"]

[tool.pytest.ini_options]
norecursedirs = ["99_unsortiert", "external", "private-gpt-main", "node_modules", ".git"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
