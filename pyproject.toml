[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "99_unsortiert",
    "external",
    "private-gpt-main",
]

line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  "E203", "E501", "E702",
  "F841", "F401", "F811", "F541",
  "B006", "B007", "B008", "B904", "B905",
  "UP006", "UP007", "UP035", "UP015",
  "UP045",
  "I001",
]

[tool.ruff.lint.per-file-ignores]
"utils/**" = ["ALL"]
"streamlit/**" = ["ALL"]
"src/**" = ["ALL"]
"scripts/**" = ["ALL"]
"simulations/**" = ["ALL"]
"tests/**" = ["ALL"]
"tools/**" = ["ALL"]
"pages/**" = ["ALL"]
"auth/**" = ["ALL"]
"jules/**" = ["ALL"]
"Jules/**" = ["ALL"]
"analysis/**" = ["ALL"]
"config/**" = ["ALL"]
"99_unsortiert/**" = ["ALL"]
"external/**" = ["ALL"]
"manifest/**" = ["ALL"]
"data/**" = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
ignore_missing_imports = true
exclude = [
    "99_unsortiert",
    "external",
    "private-gpt-main",
    "node_modules",
]

[tool.black]
line-length = 100
target-version = ['py310']
extend-exclude = '''
/(
  | 99_unsortiert
  | external
  | private-gpt-main
  | node_modules
)/
'''

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov"
testpaths = [
    "tests",
    "src_python/tests",
]
norecursedirs = [
    "99_unsortiert",
    "external",
    "private-gpt-main",
    "node_modules",
]
markers = [
    "integration: mark test as an integration test",
    "asyncio: mark test as async",
]
pythonpath = [
    ".",
    "src_python",
]
