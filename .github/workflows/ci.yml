name: CI
permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          export PYTHONPATH=.
          python -m pip install --upgrade pip
          pip install -r requirements_extended.txt
          pip install ruff black mypy pytest-cov pydantic pyyaml fuzzywuzzy python-Levenshtein PyPDF2 networkx discord.py httpx keyring pytest-asyncio

      - name: Ruff Lint
        run: ruff check .

      - name: Black Format Check
        run: black --check .

      - name: Mypy Type Check
        run: mypy src_python

      - name: Run tests (only repo tests)
        run: |
          export PYTHONPATH=.
          pytest tests -q
