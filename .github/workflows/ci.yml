name: CI
permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          export PYTHONPATH=.
          python -m pip install --upgrade pip
          pip install -r requirements_extended.txt
          pip install ruff black mypy pytest-cov pydantic pyyaml fuzzywuzzy python-Levenshtein PyPDF2 networkx discord.py httpx keyring pytest-asyncio

      - name: Ruff Lint
        run: ruff check --exclude "99_unsortiert,external,simulations/data" .
        continue-on-error: true

      - name: Black Format Check
        run: black --check --exclude "/(99_unsortiert|external|simulations\/data)/" .
        continue-on-error: true

      - name: Mypy Type Check (src_python)
        run: mypy src_python
        continue-on-error: true

      - name: Mypy Type Check (src)
        run: mypy src
        continue-on-error: true

      - name: Run tests
        run: pytest tests -q
