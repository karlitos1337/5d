name: CI
permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          export PYTHONPATH=.
          python -m pip install --upgrade pip
          pip install -r requirements_extended.txt
          pip install ruff black mypy pytest-cov pydantic pyyaml fuzzywuzzy python-Levenshtein PyPDF2 networkx discord.py httpx keyring pytest-asyncio
          pip install ruff black mypy pydantic networkx

      - name: Ruff Lint
        run: ruff check .

      - name: Black Format Check
        continue-on-error: true
        run: black --check --extend-exclude '/(99_unsortiert|utils|streamlit|src|scripts|simulations|tests|tools|pages|auth|jules|Jules|external|analysis|config|data|manifest|private-gpt-main)/' .

      - name: Mypy Type Check
        run: mypy src_python
        continue-on-error: true
        run: mypy src

      - name: Run tests (only repo tests)
        run: |
          export PYTHONPATH=.
          pytest tests -q
          pytest tests -q --ignore=tests/test_anonymization.py --ignore=tests/test_extractor.py --ignore=tests/test_participation_networks.py --ignore=tests/test_discord_bot.py -p no:warnings
