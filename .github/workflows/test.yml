name: 5D Tests & Validation
permissions:
  contents: read

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements_extended.txt
          pip install pytest pytest-cov pydantic pyyaml fuzzywuzzy python-Levenshtein PyPDF2 networkx discord.py httpx keyring pytest-asyncio
      - name: Run Tests
        run: PYTHONPATH=. pytest -v --cov=. --cov-report=xml
          pip install pytest pytest-cov pydantic pyaml fuzzywuzzy python-Levenshtein PyPDF2 networkx
      - name: Run Tests
        run: |
          export PYTHONPATH=.
          pytest -v --cov=. --cov-report=xml
      - name: Validate JSON Schema (optional)
        run: |
          python - << 'PY'
          import json
          from models.schemas import Solutions
          try:
            with open('5d_solutions.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
            Solutions(**data)
          except FileNotFoundError:
            print('No 5d_solutions.json present; skipping validation.')
          PY
        run: pytest tests/ -v --cov=tests/ --cov-report=xml --ignore=tests/test_anonymization.py --ignore=tests/test_extractor.py --ignore=tests/test_participation_networks.py --ignore=tests/test_discord_bot.py -p no:warnings
