name: Pilotdaten exportieren

# Überträgt alle in Supabase freigegebenen Spenden (approved = true) nach
# 08_experimente_validierung/data/pilot_responses.csv.
# Der geplante Lauf alle drei Tage hält das Gratis-Projekt zugleich aktiv,
# damit Supabase es nicht nach einer Woche ohne Nutzung pausiert.
#
# Benötigte Repository-Secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 */3 * *'

permissions:
  contents: write

concurrency:
  group: pilot-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - name: Secrets vorhanden?
        id: check
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "Supabase ist noch nicht eingerichtet, nichts zu tun."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.check.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Freigegebene Spenden exportieren
        if: steps.check.outputs.ready == 'true'
        run: python scripts/pilot_export.py

      - name: Commit, falls sich etwas geändert hat
        if: steps.check.outputs.ready == 'true'
        run: |
          git add 08_experimente_validierung/data/pilot_responses.csv
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(pilot): freigegebene Spenden exportiert"
          git push
