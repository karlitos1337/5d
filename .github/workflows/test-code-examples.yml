name: Test Code Examples
permissions:
  contents: read

on:
  push:
    branches: [ main, feature/** ]
    paths:
      - '05-technologie/examples/**'
      - '08-experimente-validierung/experiments/**'
      - '.github/workflows/test-code-examples.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '05-technologie/examples/**'
      - '08-experimente-validierung/experiments/**'

jobs:
  test-examples:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy scipy
    
    - name: Test Swarm Intelligence
      run: |
        python 05-technologie/examples/swarm_intelligence.py
    
    - name: Test Active Inference
      run: |
        python 05-technologie/examples/active_inference_demo.py
    
    - name: Test Topological Analysis (if exists)
      run: |
        if [ -f "05-technologie/examples/topological_analysis.py" ]; then
          python 05-technologie/examples/topological_analysis.py
        else
          echo "⚠️  TDA example not yet merged"
        fi
    
    - name: ✅ All examples passed
      run: |
        echo "🎉 All code examples executed successfully!"
